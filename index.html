<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de la Compra</title>
<meta name="description" content="Lista de la compra editable con categorías de alimentación, bebidas, aseo, limpieza y varios.">
<meta name="theme-color" content="#4B7A5C">

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lista">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root{
    --bg:#FBF7F0;
    --surface:#FFFFFF;
    --surface-soft:#F5EFE3;
    --ink:#2A241C;
    --ink-soft:#7A7060;
    --ink-faint:#B3A996;
    --border:#E7DFD1;
    --accent:#4B7A5C;
    --accent-ink:#FFFFFF;
    --cat-alimentacion:#C1662F;
    --cat-bebidas:#3E7CA6;
    --cat-aseo:#9A6FB0;
    --cat-limpieza:#2F9C8F;
    --cat-varios:#8C7A4E;
    --shadow: 0 1px 2px rgba(42,36,28,0.06), 0 4px 14px rgba(42,36,28,0.05);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1815;
      --surface:#242019;
      --surface-soft:#2C271F;
      --ink:#F1EAE0;
      --ink-soft:#B3A996;
      --ink-faint:#6E6455;
      --border:#3A342A;
      --accent:#6FA482;
      --accent-ink:#12251A;
      --cat-alimentacion:#E08A54;
      --cat-bebidas:#6DA6CC;
      --cat-aseo:#BA98D6;
      --cat-limpieza:#5CC4B5;
      --cat-varios:#C7B074;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1815;
    --surface:#242019;
    --surface-soft:#2C271F;
    --ink:#F1EAE0;
    --ink-soft:#B3A996;
    --ink-faint:#6E6455;
    --border:#3A342A;
    --accent:#6FA482;
    --accent-ink:#12251A;
    --cat-alimentacion:#E08A54;
    --cat-bebidas:#6DA6CC;
    --cat-aseo:#BA98D6;
    --cat-limpieza:#5CC4B5;
    --cat-varios:#C7B074;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-inline:16px;
    padding-block:0 32px;
  }
  h1,h2{font-family:"Fraunces", Georgia, serif;}

  .wrap{max-width:600px;margin:0 auto;}

  header.top{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    background:var(--bg);
    padding-block:20px 14px;
    z-index:5;
  }
  header.top h1{
    font-size:1.9rem;
    font-weight:600;
    margin:0 0 4px;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin:0 0 14px;
  }

  .pending-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:0.85rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    background:var(--surface-soft);
    border:1px solid var(--border);
    padding:5px 12px;
    border-radius:999px;
  }
  .pending-label strong{
    color:var(--accent);
    font-size:0.98rem;
  }

  main{display:flex;flex-direction:column;gap:22px;margin-top:6px;}

  section.category{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--cat-color, var(--accent));
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .cat-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:14px 16px 8px;
  }
  .cat-head h2{
    font-size:1.15rem;
    font-weight:600;
    margin:0;
    color:var(--cat-color, var(--ink));
  }
  .cat-count{
    font-size:0.78rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }

  ul.items{list-style:none;margin:0;padding:2px 8px 6px;}
  ul.items:empty::after{
    content:"Sin productos todavía";
    display:block;
    color:var(--ink-faint);
    font-size:0.88rem;
    padding:10px 8px 14px;
    font-style:italic;
  }
  li.item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 6px;
    border-radius:9px;
  }
  li.item:hover{background:var(--surface-soft);}

  .reorder{
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  button.move{
    border:none;
    background:transparent;
    color:var(--ink-faint);
    width:22px;
    height:16px;
    line-height:1;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:5px;
    font-size:0.7rem;
  }
  button.move:hover{background:var(--surface-soft); color:var(--ink);}
  button.move:disabled{opacity:0.25; cursor:default;}
  button.move:disabled:hover{background:transparent; color:var(--ink-faint);}

  label.check{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    cursor:pointer;
  }
  input[type="checkbox"]{
    appearance:none;
    width:21px;height:21px;
    min-width:21px;
    border-radius:7px;
    border:1.6px solid var(--border);
    background:var(--surface);
    display:grid;
    place-content:center;
    cursor:pointer;
  }
  input[type="checkbox"]::after{
    content:"";
    width:10px;height:10px;
    clip-path:polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    background:var(--accent-ink);
    transform:scale(0);
    transition:transform .12s ease;
  }
  input[type="checkbox"]:checked{
    background:var(--cat-color, var(--accent));
    border-color:var(--cat-color, var(--accent));
  }
  input[type="checkbox"]:checked::after{transform:scale(1);}

  .item-text{
    font-size:0.98rem;
    overflow-wrap:anywhere;
  }
  li.item.tobuy{
    background:color-mix(in srgb, var(--cat-color, var(--accent)) 12%, transparent);
  }
  li.item.tobuy .item-text{
    color:var(--ink);
    font-weight:600;
  }

  button.del{
    border:none;
    background:transparent;
    color:var(--ink-faint);
    font-size:1.1rem;
    line-height:1;
    padding:4px 6px;
    border-radius:7px;
    cursor:pointer;
  }
  button.del:hover{background:var(--surface-soft); color:#B0483F;}
  button.del:focus-visible, input:focus-visible, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  form.add-form{
    display:flex;
    gap:8px;
    padding:10px 16px 16px;
    border-top:1px solid var(--border);
    margin-top:4px;
  }
  form.add-form input[type="text"]{
    flex:1;
    min-width:0;
    background:var(--surface-soft);
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 12px;
    font-size:0.92rem;
    color:var(--ink);
    font-family:inherit;
  }
  form.add-form input[type="text"]::placeholder{color:var(--ink-faint);}
  form.add-form button{
    border:none;
    background:var(--cat-color, var(--accent));
    color:var(--accent-ink);
    width:38px;
    border-radius:9px;
    font-size:1.15rem;
    cursor:pointer;
    flex-shrink:0;
  }
  form.add-form button:hover{filter:brightness(1.06);}

  footer.actions{
    display:flex;
    justify-content:center;
    margin-top:6px;
  }
  button.reset-all{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  button.reset-all:hover{border-color:var(--accent); color:var(--accent);}
  button.reset-all:disabled{opacity:0.45; cursor:default;}
  button.reset-all:disabled:hover{border-color:var(--border); color:var(--ink-soft);}

  @media (max-width:420px){
    header.top h1{font-size:1.6rem;}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap">
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Lista de la compra</h1>
    <p class="sub" id="subtitle">Marca lo que necesitas comprar.</p>
    <span class="pending-label"><strong id="pendingCount">0</strong> por comprar</span>
  </header>
  <main id="app"></main>
  <footer class="actions">
    <button class="reset-all" id="resetAll">Desmarcar todo</button>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "lista-compra-state";

  var DEFAULT_STATE = {
    categories: [
      {
        key: "alimentacion",
        label: "Alimentación",
        color: "var(--cat-alimentacion)",
        items: [
          {id:"a1", text:"Pan", toBuy:false},
          {id:"a2", text:"Leche", toBuy:false},
          {id:"a3", text:"Huevos", toBuy:false},
          {id:"a4", text:"Arroz", toBuy:false},
          {id:"a5", text:"Tomates", toBuy:false},
          {id:"a6", text:"Pollo", toBuy:false},
          {id:"a7", text:"Queso", toBuy:false},
          {id:"a8", text:"Aceite de oliva", toBuy:false}
        ]
      },
      {
        key: "bebidas",
        label: "Bebidas",
        color: "var(--cat-bebidas)",
        items: [
          {id:"b1", text:"Agua", toBuy:false},
          {id:"b2", text:"Vino tinto", toBuy:false},
          {id:"b3", text:"Zumo de naranja", toBuy:false},
          {id:"b4", text:"Café", toBuy:false}
        ]
      },
      {
        key: "aseo",
        label: "Aseo",
        color: "var(--cat-aseo)",
        items: [
          {id:"s1", text:"Champú", toBuy:false},
          {id:"s2", text:"Gel de ducha", toBuy:false},
          {id:"s3", text:"Pasta de dientes", toBuy:false},
          {id:"s4", text:"Papel higiénico", toBuy:false}
        ]
      },
      {
        key: "limpieza",
        label: "Limpieza",
        color: "var(--cat-limpieza)",
        items: [
          {id:"l1", text:"Detergente", toBuy:false},
          {id:"l2", text:"Lejía", toBuy:false},
          {id:"l3", text:"Bolsas de basura", toBuy:false},
          {id:"l4", text:"Limpiacristales", toBuy:false}
        ]
      },
      {
        key: "varios",
        label: "Varios",
        color: "var(--cat-varios)",
        items: [
          {id:"v1", text:"Pilas", toBuy:false},
          {id:"v2", text:"Bombillas", toBuy:false}
        ]
      }
    ]
  };

  function cloneDefault(){
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  // Combina lo guardado con la plantilla actual: conserva tus productos y
  // marcas, pero añade cualquier categoría nueva (p.ej. "Varios") que tu
  // copia guardada todavía no tenga, y normaliza el campo toBuy.
  function reconcile(saved){
    var fresh = cloneDefault();
    var savedByKey = {};
    saved.categories.forEach(function(c){
      if(c && c.key) savedByKey[c.key] = c;
    });

    var merged = fresh.categories.map(function(defCat){
      var existing = savedByKey[defCat.key];
      if(!existing || !Array.isArray(existing.items)) return defCat;
      delete savedByKey[defCat.key];
      return {
        key: defCat.key,
        label: defCat.label,
        color: defCat.color,
        items: existing.items.map(function(it){
          return {
            id: it.id,
            text: it.text,
            toBuy: typeof it.toBuy === "boolean" ? it.toBuy : false
          };
        })
      };
    });

    // Conserva categorías propias que el usuario hubiera añadido y que no estén en la plantilla.
    Object.keys(savedByKey).forEach(function(key){
      var extra = savedByKey[key];
      if(extra && Array.isArray(extra.items)){
        merged.push({
          key: extra.key,
          label: extra.label || extra.key,
          color: extra.color || "var(--accent)",
          items: extra.items.map(function(it){
            return {
              id: it.id,
              text: it.text,
              toBuy: typeof it.toBuy === "boolean" ? it.toBuy : false
            };
          })
        });
      }
    });

    return {categories: merged};
  }

  function loadState(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.categories)) return reconcile(parsed);
      }
    }catch(e){ /* localStorage no disponible: seguimos con el estado por defecto */ }
    return cloneDefault();
  }

  function saveState(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* no se pudo guardar: la sesión sigue funcionando igualmente */ }
  }

  var state = loadState();

  function uid(){
    return Math.random().toString(36).slice(2,9);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function countAll(){
    var total=0, toBuy=0;
    state.categories.forEach(function(cat){
      cat.items.forEach(function(it){
        total++;
        if(it.toBuy) toBuy++;
      });
    });
    return {total:total, toBuy:toBuy};
  }

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = state.categories.map(renderCategory).join("");

    var counts = countAll();
    document.getElementById("pendingCount").textContent = counts.toBuy;

    var sub = document.getElementById("subtitle");
    if(counts.total === 0){
      sub.textContent = "Añade productos con el botón + de cada categoría.";
    } else if(counts.toBuy === 0){
      sub.textContent = "Marca lo que necesitas comprar.";
    } else {
      sub.textContent = "Desmarca cada producto según lo metas en el carro.";
    }

    var resetBtn = document.getElementById("resetAll");
    resetBtn.disabled = counts.toBuy === 0;

    attachHandlers();
  }

  function renderCategory(cat){
    var toBuyCount = cat.items.filter(function(i){return i.toBuy;}).length;
    var lastIndex = cat.items.length - 1;
    var itemsHtml = cat.items.map(function(it, idx){
      return (
        '<li class="item' + (it.toBuy ? ' tobuy' : '') + '" data-cat="' + cat.key + '" data-id="' + it.id + '">' +
          '<span class="reorder">' +
            '<button class="move up" type="button" data-dir="-1" aria-label="Subir ' + escapeHtml(it.text) + '"' + (idx === 0 ? ' disabled' : '') + '>&#9650;</button>' +
            '<button class="move down" type="button" data-dir="1" aria-label="Bajar ' + escapeHtml(it.text) + '"' + (idx === lastIndex ? ' disabled' : '') + '>&#9660;</button>' +
          '</span>' +
          '<label class="check">' +
            '<input type="checkbox" ' + (it.toBuy ? 'checked' : '') + ' aria-label="' + escapeHtml(it.text) + '">' +
            '<span class="item-text">' + escapeHtml(it.text) + '</span>' +
          '</label>' +
          '<button class="del" type="button" aria-label="Eliminar ' + escapeHtml(it.text) + '">&times;</button>' +
        '</li>'
      );
    }).join("");

    return (
      '<section class="category" style="--cat-color:' + cat.color + '">' +
        '<div class="cat-head">' +
          '<h2>' + escapeHtml(cat.label) + '</h2>' +
          '<span class="cat-count">' + toBuyCount + '/' + cat.items.length + '</span>' +
        '</div>' +
        '<ul class="items">' + itemsHtml + '</ul>' +
        '<form class="add-form" data-cat="' + cat.key + '">' +
          '<input type="text" name="text" placeholder="Añadir a ' + escapeHtml(cat.label.toLowerCase()) + '&hellip;" autocomplete="off">' +
          '<button type="submit" aria-label="Añadir">+</button>' +
        '</form>' +
      '</section>'
    );
  }

  function findCat(key){
    return state.categories.find(function(c){ return c.key === key; });
  }

  function attachHandlers(){
    document.querySelectorAll("li.item input[type=checkbox]").forEach(function(cb){
      cb.addEventListener("change", function(){
        var li = cb.closest("li.item");
        var cat = findCat(li.dataset.cat);
        var item = cat.items.find(function(i){ return i.id === li.dataset.id; });
        if(item){ item.toBuy = cb.checked; }
        render();
        saveState();
      });
    });

    document.querySelectorAll("li.item button.move").forEach(function(btn){
      btn.addEventListener("click", function(){
        var li = btn.closest("li.item");
        var cat = findCat(li.dataset.cat);
        var idx = cat.items.findIndex(function(i){ return i.id === li.dataset.id; });
        var dir = parseInt(btn.dataset.dir, 10);
        var target = idx + dir;
        if(target < 0 || target >= cat.items.length) return;
        var tmp = cat.items[idx];
        cat.items[idx] = cat.items[target];
        cat.items[target] = tmp;
        render();
        saveState();
      });
    });

    document.querySelectorAll("li.item button.del").forEach(function(btn){
      btn.addEventListener("click", function(){
        var li = btn.closest("li.item");
        var cat = findCat(li.dataset.cat);
        cat.items = cat.items.filter(function(i){ return i.id !== li.dataset.id; });
        render();
        saveState();
      });
    });

    document.querySelectorAll("form.add-form").forEach(function(form){
      form.addEventListener("submit", function(ev){
        ev.preventDefault();
        var input = form.querySelector("input[name=text]");
        var text = input.value.trim();
        if(!text) return;
        var cat = findCat(form.dataset.cat);
        cat.items.push({id: uid(), text: text, toBuy:false});
        input.value = "";
        render();
        saveState();
        var freshInput = document.querySelector('form.add-form[data-cat="' + form.dataset.cat + '"] input[name=text]');
        if(freshInput) freshInput.focus();
      });
    });
  }

  document.getElementById("resetAll").addEventListener("click", function(){
    state.categories.forEach(function(cat){
      cat.items.forEach(function(i){ i.toBuy = false; });
    });
    render();
    saveState();
  });

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){ /* sin service worker: la app sigue funcionando igual */ });
    });
  }
})();
</script>
</body>
</html>
